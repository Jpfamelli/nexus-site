<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Monograma Nexus">
  <!-- Monograma geométrico: interseção entre N e X (traço diagonal compartilhado em bronze) -->
  <rect width="96" height="96" fill="#0B1B2B"/>
  <rect x="0.5" y="0.5" width="95" height="95" fill="none" stroke="#B0761F" stroke-opacity="0.35"/>
  <!-- vertical esquerda do N (com corte reto no topo) -->
  <polygon points="27,26 34,33 34,70 27,70" fill="#F5E9D6"/>
  <!-- vertical direita do N -->
  <polygon points="62,26 69,26 69,63 62,70" fill="#F5E9D6"/>
  <!-- diagonal compartilhada N + X (bronze) -->
  <polygon points="27,26 34,26 69,70 62,70" fill="#B0761F"/>
  <!-- contradiagonal do X -->
  <polygon points="62,26 69,26 34,70 27,70" fill="#F5E9D6" fill-opacity="0.82"/>
</svg>
